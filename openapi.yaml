openapi: 3.0.3
info:
  title: CarPool API
  version: 0.1.0
  description: API contract for the CarPool route-based ride-sharing platform.
servers:
  - url: http://localhost:8000

tags:
  - name: Auth
  - name: Locations
  - name: Routes
  - name: Trips
  - name: Search
  - name: Bookings
  - name: Vehicles
  - name: Reviews
  - name: Ride Preferences
  - name: Notifications
  - name: Health

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Verification email could not be sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /locations:
    post:
      tags: [Locations]
      summary: Create a new location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreate' }
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Locations]
      summary: Search locations for autocomplete
      operationId: listLocations
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LocationStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Matching locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocations'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /routes:
    get:
      tags: [Routes]
      summary: List routes for the logged in user
      operationId: listRoutes
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: List of routes belonging to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoutes'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Routes]
      summary: Create a route with ordered stops
      operationId: createRoute
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /routes/{routeId}:
    get:
      tags: [Routes]
      summary: Get a route
      operationId: getRoute
      parameters:
        - { $ref: '#/components/parameters/RouteId' }
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips:
    post:
      tags: [Trips]
      summary: Schedule a route instance
      operationId: createTrip
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreate' }
      responses:
        '201':
          description: Trip scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Trips]
      summary: List trips
      operationId: listTrips
      parameters:
        - name: route_id
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: min_seats
          in: query
          schema: { type: integer, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TripStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Matching trips
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTrips' }

  /trips/{tripId}/passengers:
    get:
      tags: [Trips]
      summary: List passengers for a trip
      operationId: listTripPassengers
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
      responses:
        '200':
          description: List of passengers on the trip
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PassengerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    post:
      tags: [Search]
      summary: Find matching trips
      operationId: searchTrips
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Trips matching the requested route and seat count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings for the authenticated user
      operationId: listBookings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: List of bookings belonging to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookings'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bookings]
      summary: Book seats on a trip
      operationId: createBooking
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreate' }
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      summary: Get a booking
      operationId: getBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BookingId' }
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Bookings]
      summary: Cancel a booking
      operationId: cancelBookingDelete
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BookingId' }
      responses:
        '204':
          description: Booking cancelled
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }


  /bookings/{bookingId}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel a booking
      operationId: cancelBooking
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BookingId' }
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vehicles:
    post:
      tags: [Vehicles]
      summary: Register a vehicle
      operationId: createVehicle
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Vehicles]
      summary: List authenticated driver's vehicles
      operationId: listVehicles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of vehicles belonging to the driver
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      summary: Get vehicle details
      operationId: getVehicle
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VehicleId' }
      responses:
        '200':
          description: Vehicle details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vehicles]
      summary: Update vehicle details
      operationId: updateVehicle
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VehicleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleUpdate' }
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Vehicles]
      summary: Delete a vehicle
      operationId: deleteVehicle
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VehicleId' }
      responses:
        '204':
          description: Vehicle deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicleId}/photo:
    post:
      tags: [Vehicles]
      summary: Upload a vehicle photo
      operationId: uploadVehiclePhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VehicleId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reviews:
    post:
      tags: [Reviews]
      summary: Review a completed booking
      operationId: createReview
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /ride-preferences:
    post:
      tags: [Ride Preferences]
      summary: Create a ride preference
      operationId: createRidePreference
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRidePreferenceRequest' }
      responses:
        '201':
          description: Ride preference created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePreferenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Ride Preferences]
      summary: List current user's ride preferences
      operationId: listRidePreferences
      security: [{ bearerAuth: [] }]
      parameters:
        - name: active_only
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: List of user's ride preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RidePreferenceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /ride-preferences/matches:
    get:
      tags: [Ride Preferences]
      summary: List active ride preferences matching locations
      operationId: listMatchingRidePreferences
      security: [{ bearerAuth: [] }]
      parameters:
        - name: source_location_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - name: destination_location_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Matching active ride preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RidePreferenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /ride-preferences/{preference_id}:
    get:
      tags: [Ride Preferences]
      summary: Get a ride preference by ID
      operationId: getRidePreference
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RidePreferenceId' }
      responses:
        '200':
          description: Ride preference details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePreferenceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Ride Preferences]
      summary: Update a ride preference
      operationId: updateRidePreference
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RidePreferenceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRidePreferenceRequest' }
      responses:
        '200':
          description: Updated ride preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePreferenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Ride Preferences]
      summary: Delete a ride preference
      operationId: deleteRidePreference
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/RidePreferenceId' }
      responses:
        '204':
          description: Ride preference deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [Health]
      summary: Check API liveness
      operationId: healthCheck
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /ready:
    get:
      tags: [Health]
      summary: Check API readiness
      operationId: readinessCheck
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /notifications:
    get:
      tags: [Notifications]
      summary: List user notifications
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: is_read
          schema: { type: boolean, nullable: true }
        - in: query
          name: status
          schema: { type: string, enum: [unread, read, archived], nullable: true }
        - in: query
          name: type
          schema: { type: string, enum: [booking_confirmation, booking_request, booking_cancelled, booking_rejected, trip_cancelled, trip_updated, system], nullable: true }
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notifications count
      operationId: getUnreadNotificationsCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notification_id}:
    get:
      tags: [Notifications]
      summary: Get notification by ID
      operationId: getNotificationById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notification_id
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
      responses:
        '200':
          description: Notification details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }
    RidePreferenceId:
      name: preference_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/UUID' }


  responses:
    BadRequest:
      description: Bad request or validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication is required or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The user lacks the required role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with the current resource state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    UUID: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        code: { type: string }
    UserRole:
      type: string
      enum: [driver, rider]
    TripStatus:
      type: string
      enum: [scheduled, completed, cancelled]
    BookingStatus:
      type: string
      enum: [pending, confirmed, cancelled, expired]
    LocationStatus:
      type: string
      enum: [active, inactive]

    User:
      type: object
      required: [id, name, email, roles, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RegisterRequest:
      type: object
      required: [name, email, password, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/UserRole' }
    RegisterResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, minimum: 1 }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    Location:
      type: object
      required: [id, name, city, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        lat: { type: number, format: double, minimum: -90, maximum: 90, nullable: true }
        lng: { type: number, format: double, minimum: -180, maximum: 180, nullable: true }
        status: { $ref: '#/components/schemas/LocationStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    LocationCreate:
      type: object
      required: [name, city]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 255 }
        lat: { type: number, format: double, minimum: -90, maximum: 90, nullable: true }
        lng: { type: number, format: double, minimum: -180, maximum: 180, nullable: true }
        status: { $ref: '#/components/schemas/LocationStatus' }

    Vehicle:
      type: object
      required: [id, driver_id, make, model, registration_number, total_seats, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        driver_id: { $ref: '#/components/schemas/UUID' }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        registration_number: { type: string, minLength: 1, maxLength: 50 }
        total_seats: { type: integer, minimum: 1, maximum: 50 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    VehicleCreate:
      type: object
      required: [make, model, registration_number, total_seats]
      properties:
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        registration_number: { type: string, minLength: 1, maxLength: 50 }
        total_seats: { type: integer, minimum: 1, maximum: 50 }
    VehicleUpdate:
      type: object
      properties:
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        registration_number: { type: string, minLength: 1, maxLength: 50 }
        total_seats: { type: integer, minimum: 1, maximum: 50 }

    RouteStop:
      type: object
      required: [id, route_id, location_id, sequence, eta_offset_minutes, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        route_id: { $ref: '#/components/schemas/UUID' }
        location_id: { $ref: '#/components/schemas/UUID' }
        sequence: { type: integer, minimum: 0 }
        eta_offset_minutes: { type: integer, minimum: 0 }
        location: { $ref: '#/components/schemas/Location' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RouteStopCreate:
      type: object
      required: [location_id, sequence, eta_offset_minutes]
      properties:
        location_id: { $ref: '#/components/schemas/UUID' }
        sequence: { type: integer, minimum: 0 }
        eta_offset_minutes: { type: integer, minimum: 0 }
    Route:
      type: object
      required: [id, driver_id, vehicle_id, name, stops, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        driver_id: { $ref: '#/components/schemas/UUID' }
        vehicle_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, maxLength: 255 }
        driver: { $ref: '#/components/schemas/User' }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/RouteStop' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    RouteCreate:
      type: object
      required: [vehicle_id, name]
      properties:
        vehicle_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string, minLength: 1, maxLength: 255 }
        stops:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/RouteStopCreate' }

    Trip:
      type: object
      required: [id, route_id, departure_date, departure_time, available_seats, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        route_id: { $ref: '#/components/schemas/UUID' }
        departure_date: { type: string, format: date }
        departure_time: { type: string, format: time }
        available_seats: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/TripStatus' }
        route: { $ref: '#/components/schemas/Route' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    TripCreate:
      type: object
      required: [route_id, departure_date, departure_time, available_seats]
      properties:
        route_id: { $ref: '#/components/schemas/UUID' }
        departure_date: { type: string, format: date }
        departure_time: { type: string, format: time }
        available_seats: { type: integer, minimum: 1 }
    SearchRequest:
      type: object
      required: [source_location_id, destination_location_id, date, seats_needed]
      properties:
        source_location_id: { $ref: '#/components/schemas/UUID' }
        destination_location_id: { $ref: '#/components/schemas/UUID' }
        date: { type: string, format: date }
        seats_needed: { type: integer, minimum: 1 }
    SearchResult:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            pickup_stop: { $ref: '#/components/schemas/RouteStop' }
            dropoff_stop: { $ref: '#/components/schemas/RouteStop' }
            eta_minutes: { type: integer, minimum: 0 }
    SearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        total: { type: integer, minimum: 0 }

    Booking:
      type: object
      required: [id, trip_id, rider_id, pickup_stop_id, dropoff_stop_id, seats_booked, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        trip_id: { $ref: '#/components/schemas/UUID' }
        rider_id: { $ref: '#/components/schemas/UUID' }
        pickup_stop_id: { $ref: '#/components/schemas/UUID' }
        dropoff_stop_id: { $ref: '#/components/schemas/UUID' }
        seats_booked: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        trip: { $ref: '#/components/schemas/Trip' }
        rider: { $ref: '#/components/schemas/User' }
        pickup_stop: { $ref: '#/components/schemas/RouteStop' }
        dropoff_stop: { $ref: '#/components/schemas/RouteStop' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    BookingCreate:
      type: object
      required: [trip_id, pickup_stop_id, dropoff_stop_id, seats_booked]
      properties:
        trip_id: { $ref: '#/components/schemas/UUID' }
        pickup_stop_id: { $ref: '#/components/schemas/UUID' }
        dropoff_stop_id: { $ref: '#/components/schemas/UUID' }
        seats_booked: { type: integer, minimum: 1 }

    PassengerUserResponse:
      type: object
      required: [id, name, email]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        email: { type: string, format: email }

    PassengerResponse:
      type: object
      required: [id, booking_id, rider_id, rider_name, rider_email, rider, seats_booked, status, pickup_stop, dropoff_stop, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        booking_id: { $ref: '#/components/schemas/UUID' }
        rider_id: { $ref: '#/components/schemas/UUID' }
        rider_name: { type: string }
        rider_email: { type: string, format: email }
        rider: { $ref: '#/components/schemas/PassengerUserResponse' }
        seats_booked: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        pickup_stop: { $ref: '#/components/schemas/RouteStop' }
        dropoff_stop: { $ref: '#/components/schemas/RouteStop' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    Review:
      type: object
      required: [id, booking_id, rating, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        booking_id: { $ref: '#/components/schemas/UUID' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ReviewCreate:
      type: object
      required: [booking_id, rating]
      properties:
        booking_id: { $ref: '#/components/schemas/UUID' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }

    PaginatedLocations:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Location' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PaginatedTrips:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Trip' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PaginatedRoutes:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Route' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PaginatedBookings:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, unavailable] }
        database: { type: string, enum: [ok, unavailable] }

    CreateRidePreferenceRequest:
      type: object
      required: [source_location_id, destination_location_id]
      properties:
        source_location_id: { $ref: '#/components/schemas/UUID' }
        destination_location_id: { $ref: '#/components/schemas/UUID' }
        preferred_departure_time: { type: string, format: time, nullable: true, example: "08:30:00" }
        seats_needed: { type: integer, minimum: 1, default: 1 }
        is_active: { type: boolean, default: true }
        label: { type: string, maxLength: 100, nullable: true }

    UpdateRidePreferenceRequest:
      type: object
      properties:
        source_location_id: { $ref: '#/components/schemas/UUID' }
        destination_location_id: { $ref: '#/components/schemas/UUID' }
        preferred_departure_time: { type: string, format: time, nullable: true, example: "08:30:00" }
        seats_needed: { type: integer, minimum: 1, nullable: true }
        is_active: { type: boolean, nullable: true }
        label: { type: string, maxLength: 100, nullable: true }

    RidePreferenceResponse:
      type: object
      required: [id, rider_id, source_location_id, destination_location_id, seats_needed, is_active, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        rider_id: { $ref: '#/components/schemas/UUID' }
        source_location_id: { $ref: '#/components/schemas/UUID' }
        destination_location_id: { $ref: '#/components/schemas/UUID' }
        preferred_departure_time: { type: string, format: time, nullable: true }
        seats_needed: { type: integer, minimum: 1 }
        is_active: { type: boolean }
        label: { type: string, maxLength: 100, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        source: { $ref: '#/components/schemas/Location' }
        destination: { $ref: '#/components/schemas/Location' }
        rider: { $ref: '#/components/schemas/PassengerUserResponse' }

    NotificationResponse:
      type: object
      required: [id, user_id, title, message, type, status, is_read, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        title: { type: string }
        message: { type: string }
        type: { type: string, enum: [booking_confirmation, booking_request, booking_cancelled, booking_rejected, trip_cancelled, trip_updated, system] }
        status: { type: string, enum: [unread, read, archived] }
        is_read: { type: boolean }
        read_at: { $ref: '#/components/schemas/Timestamp', nullable: true }
        data: { type: object, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    PaginatedNotificationsResponse:
      type: object
      required: [items, page, limit, total, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationResponse' }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        unread_count: { type: integer }

    NotificationUnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer }


